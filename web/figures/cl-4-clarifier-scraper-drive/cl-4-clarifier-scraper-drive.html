.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}

.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

.cl-sludge{fill:var(--cl-sludge);stroke:none}
.cl-sludge-top{fill:var(--cl-sludge-top);stroke:none}
.cl-hopper,.cl-pipe{fill:var(--cl-hopper);stroke:none}
.iso-shade.cl-cut{fill:var(--cl-cut)}
.cl-weir{fill:var(--cl-weir);stroke:none}
.cl-stage{touch-action:pan-y;cursor:ew-resize;outline:none}
.cl-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}

@media (max-width:560px){.cl .iso-plate-corner[data-corner="title"]{font-size:9.5px}.cl .iso-plate-corner[data-corner="readout"]{font-size:9.5px}}
/* take-apart: the picked part is the one lit part; every other pickable part steps down one tone (fixed tokens, no self-reference) */
.cl{--cl-hi:#d4d4d4;--cl-mid:#6a6a6a;--cl-lo:#3e3e3e;--cl-top:#1c1c1c;--cl-shade:#151515}
.iso[data-theme="light"] .cl{--cl-hi:#26262a;--cl-mid:#8a8a8f;--cl-lo:#b4b4b8;--cl-top:#ffffff;--cl-shade:#ededea}
.cl-stage[data-focus] [data-part]:not([data-on]){--anatomy-hi:var(--cl-mid);--anatomy-mid:var(--cl-lo);--anatomy-lit:var(--cl-mid);--anatomy-lit-top:var(--cl-top);--anatomy-lit-shade:var(--cl-shade)}
.cl [data-part][data-on]{--anatomy-hi:var(--anatomy-lit);--anatomy-mid:var(--cl-hi)}
.cl [data-part][data-on] .iso-top{fill:var(--anatomy-lit-top)}
.cl [data-part][data-on] .iso-shade{fill:var(--anatomy-lit-shade)}
.cl [data-part][data-on] [data-seamless]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.cl [data-part][data-on] [data-seamless]>.iso-top{stroke:var(--anatomy-lit-top)}
.cl-stage[data-apart]{cursor:default}
.cl-toggle{position:absolute;top:12px;left:66px;margin:0;padding:5px 9px;font:10.5px/1 var(--anatomy-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-text);background:var(--anatomy-card);border:1px solid var(--anatomy-mid);border-radius:0;cursor:pointer}
.cl-toggle:hover{border-color:var(--anatomy-text)}
.cl-toggle[aria-pressed="true"]{color:var(--anatomy-card);background:var(--anatomy-strong);border-color:var(--anatomy-strong)}
.cl-toggle:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
/* apart: the water is see-through and the tank's lines are hairlines, so the pointer goes to the part seen behind them; opaque concrete and sludge still block it */
.cl-stage[data-apart] .cl-water,.cl-stage[data-apart] .iso-line{pointer-events:none}
.cl-stage[data-apart] [data-part] .iso-line{pointer-events:auto}
.cl-hit{fill:none;stroke:none;stroke-width:6;pointer-events:none}
.cl-stage[data-apart] .cl-hit{pointer-events:stroke}

`;

const KIT = { extrude, cylinder, segment, iso, depthOf, solidSvg, lineSvg, dotsSvg, ring, sideArc, ringSeam, towardViewer, pathOf, lineOnTop };



const TANK = {
  rIn: 150,
  rOut: 160,
  top: 110,
  base: -42,
  water: 102,
  hopperR: 20,
  hopperBottomR: 8,
  hopperBottom: -32,
  slopeRun: 10,
  wedge: [17, 113], // the cut-away wedge, world degrees, facing the viewer
  pipe: [-40, -33], // desludge pipe in the slab, z range, drawn in the left section
};

const RAD = Math.PI / 180;
const polar = (deg, r, z) => [r * Math.cos(deg * RAD), r * Math.sin(deg * RAD), z];

const floorAt = (r, T = TANK) => {
  if (r >= T.hopperR) return -(T.rIn - r) / T.slopeRun;
  if (r <= T.hopperBottomR) return T.hopperBottom;
  const top = -(T.rIn - T.hopperR) / T.slopeRun;
  return T.hopperBottom + ((r - T.hopperBottomR) / (T.hopperR - T.hopperBottomR)) * (top - T.hopperBottom);
};


const MOUND_AT = 228, MOUND_W = 30, MOUND_R = 85, MOUND_DR = 34;
const wrapDeg = (deg) => ((((deg + 180) % 360) + 360) % 360) - 180;
const moundOf = (deg, r) => Math.exp(-((wrapDeg(deg - MOUND_AT) / MOUND_W) ** 2)) * Math.exp(-(((r - MOUND_R) / MOUND_DR) ** 2));


function sludgeTop(r, deg, bed, T = TANK) {
  const rr = Math.max(r, T.hopperR);
  const t = bed * (3 + 9 * (1 - (rr - T.hopperR) / (T.rIn - T.hopperR))) * (1 + 0.9 * moundOf(deg, rr));
  return floorAt(rr, T) + t;
}

const kept = (T = TANK) => [T.wedge[1], T.wedge[0] + 360]; // the remaining sector, increasing degrees


function sludgeSurface(P, bed, kit, T = TANK) {
  const [a0, a1] = kept(T);
  const pts = [];
  for (let a = a0; a <= a1 + 1e-6; a += 2) pts.push(polar(a, T.rIn, sludgeTop(T.rIn, a, bed, T)));
  for (let r = T.rIn; r >= 0; r -= 5) pts.push(polar(a1, r, sludgeTop(r, a1, bed, T)));
  for (let r = 5; r <= T.rIn; r += 5) pts.push(polar(a0, r, sludgeTop(r, a0, bed, T)));
  return kit.pathOf(pts.map((p) => kit.iso(p, P)), true);
}


function moundLines(P, bed, kit) {
  return [0.72, 0.42].map((level) => {
    const pts = [];
    for (let i = 0; i < 48; i++) {
      const t = (i / 48) * Math.PI * 2;
      const r = MOUND_R + level * MOUND_DR * 1.15 * Math.cos(t);
      const a = MOUND_AT + level * MOUND_W * 1.05 * Math.sin(t);
      pts.push(kit.iso(polar(a, r, sludgeTop(r, a, bed) + 0.2), P));
    }
    return kit.pathOf(pts, true);
  }).join("");
}


function hopperPath(P, bed, kit, T = TANK) {
  const [a0, a1] = kept(T);
  const z = sludgeTop(T.hopperR, 0, bed, T);
  const pts = [polar(a0, 0, z)];
  for (let a = a0; a <= a1 + 1e-6; a += 3) pts.push(polar(a, T.hopperR, z));
  return kit.pathOf(pts.map((p) => kit.iso(p, P)), true);
}
function hopperRim(P, bed, kit, T = TANK) {
  const [a0, a1] = kept(T);
  const z = sludgeTop(T.hopperR, 0, bed, T);
  const pts = [];
  for (let a = a0; a <= a1 + 1e-6; a += 3) pts.push(polar(a, T.hopperR, z));
  return kit.pathOf(pts.map((p) => kit.iso(p, P)));
}


function sectionRZ(bed, deg, T = TANK) {
  const floor = [];
  for (let r = 0; r <= T.rIn + 1e-6; r += r < T.hopperR ? 2 : 5) floor.push([r, floorAt(r, T)]);
  const concrete = [[0, T.base], [T.rOut, T.base], [T.rOut, T.top], [T.rIn, T.top], ...[...floor].reverse()];
  const topLine = floor.map(([r]) => [r, sludgeTop(r, deg, bed, T)]);
  const sludge = [...floor, ...[...topLine].reverse()];
  const water = [...topLine, [T.rIn, T.water], [0, T.water]];
  return { concrete, sludge, water, topLine };
}
const planePath = (rz, deg, P, kit) => kit.pathOf(rz.map(([r, z]) => kit.iso(polar(deg, r, z), P)), true);
const planeLine = (rz, deg, P, kit) => kit.pathOf(rz.map(([r, z]) => kit.iso(polar(deg, r, z), P)));






const ROTOR_DIMS = {
  slopeRun: 10, // floor falls 1 in 10 toward the centre
  rIn: 150,
  hopperR: 20,
  armFrom: 13.2,
  armTo: 142.2,
  panels: 6,
  chordLo: [14, 17],
  chordHi: [38, 41],
  chordW: 3,
  cageHalf: 12,
  post: 2.4,
  cageTop: 67,
  headHalf: 13.2,
  headTop: 70,
  shaftR: 6,
  shaftTop: 133.5,
  bladeLen: 27,
  bladeAngle: 35,
  bladeT: 1.2,
};

function floorZ(r, D = ROTOR_DIMS) {
  return -(D.rIn - Math.max(r, D.hopperR)) / D.slopeRun;
}

const box = (cx, cy, hx, hy, angle = 0) => {
  const c = Math.cos(angle), s = Math.sin(angle);
  return [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]].map(([x, y]) => [cx + x * c - y * s, cy + x * s + y * c]);
};
const span = (a, b, half) => {
  // a bar on the floor plan from point a to point b, half-width `half`
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  return box((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, L / 2, half, Math.atan2(dy, dx));
};
const turn = ([x, y], q) => [x * Math.cos(q) - y * Math.sin(q), x * Math.sin(q) + y * Math.cos(q)];

function rotorItems(D = ROTOR_DIMS) {
  const items = [];
  const H = D.cageHalf, p = D.post / 2;
  // centre column (torque shaft) from the cage head to the turntable cap
  // the centre column itself is round, so the build draws it once with the static drive
  // cage head plate
  items.push({ id: "head", centre: [0, 0, 68.5], probe: [[0, 0, 68]], always: "A", parts: [
    { t: "box", ring: box(0, 0, D.headHalf, D.headHalf), z: D.cageTop, h: D.headTop - D.cageTop, tone: "mid", bevel: 0.5,
      dots: [[-10, -10], [10, -10], [10, 10], [-10, 10]].map(([x, y]) => [x, y, D.headTop]) },
    { t: "cyl", c: [0, 0], r: D.shaftR + 2.2, z: D.headTop, h: 0.01, tone: "mid", flat: true, ringOnly: true },
  ] });
  // four corner posts
  [[H, H], [-H, H], [-H, -H], [H, -H]].forEach(([x, y], index) => {
    items.push({ id: `post${index}`, centre: [x, y, 26], probe: [[x, y, 40]], always: "A", parts: [
      { t: "box", ring: box(x, y, p, p), z: D.chordLo[0], h: D.cageTop - D.chordLo[0], tone: "mid" },
    ] });
  });
  // four cage faces: bottom and mid bars between the posts, X braces in both bays
  [[H, 0], [0, H], [-H, 0], [0, -H]].forEach(([x, y], index) => {
    const along = x ? [0, 1] : [1, 0];
    const a = [x - along[0] * (H - p), y - along[1] * (H - p)];
    const b = [x + along[0] * (H - p), y + along[1] * (H - p)];
    const bar = span(a, b, p);
    const brace = (z0, z1) => [
      [[a[0], a[1], z0], [b[0], b[1], z1]],
      [[b[0], b[1], z0], [a[0], a[1], z1]],
    ];
    items.push({ id: `face${index}`, centre: [x, y, 26], probe: [[x, y, 40]], always: "A", parts: [
      { t: "box", ring: bar, z: D.chordLo[0], h: D.chordLo[1] - D.chordLo[0], tone: "mid" },
      { t: "lines", segs: brace(D.chordLo[1], D.chordHi[0]), tone: "lo" },
      { t: "box", ring: bar, z: D.chordHi[0], h: D.chordHi[1] - D.chordHi[0], tone: "mid" },
      { t: "lines", segs: brace(D.chordHi[1], D.cageTop), tone: "lo" },
    ] });
  });
  // two arms, each a truss of six panels with a plough blade under every panel
  for (const side of [0, 1]) {
    const q = side * Math.PI;
    const step = (D.armTo - D.armFrom) / D.panels;
    for (let i = 0; i < D.panels; i++) {
      const x0 = D.armFrom + i * step, x1 = x0 + step, xm = (x0 + x1) / 2;
      const chord = box(xm, 0, step / 2, D.chordW / 2);
      const vert = (x) => box(x, 0, 1, 1);
      const parts = [];
      // plough blade, outer end leading (the arms turn anticlockwise seen from above), so sludge slides inward
      const ang = (D.bladeAngle * Math.PI) / 180;
      const half = D.bladeLen / 2;
      const outer = Math.hypot(xm + half * Math.cos(ang), half * Math.sin(ang));
      const bottom = floorZ(outer, D) + 0.8;
      parts.push({ t: "box", ring: box(xm, 0, half, D.bladeT / 2, ang), z: bottom + 1.6, h: D.chordLo[0] - bottom - 1.6, tone: "hi", blade: true });
      parts.push({ t: "box", ring: box(xm, 0, half - 0.4, D.bladeT / 2 + 0.3, ang), z: bottom, h: 1.6, tone: "lo", blade: true }); // rubber squeegee strip
      parts.push({ t: "box", ring: chord, z: D.chordLo[0], h: D.chordLo[1] - D.chordLo[0], tone: "mid", seam: true });
      const diag = i % 2 ? [[x0, 0, D.chordLo[1]], [x1, 0, D.chordHi[0]]] : [[x0, 0, D.chordHi[0]], [x1, 0, D.chordLo[1]]];
      parts.push({ t: "lines", segs: [diag], tone: "lo" });
      parts.push({ t: "box", ring: vert(x0 + 1), z: D.chordLo[1], h: D.chordHi[0] - D.chordLo[1], tone: "mid" });
      if (i === D.panels - 1) parts.push({ t: "box", ring: vert(x1 - 1), z: D.chordLo[1], h: D.chordHi[0] - D.chordLo[1], tone: "mid" });
      parts.push({ t: "box", ring: chord, z: D.chordHi[0], h: D.chordHi[1] - D.chordHi[0], tone: "mid",
        dots: [[x0 + 3, 0, D.chordHi[1]], [x1 - 3, 0, D.chordHi[1]]] });
      const item = { id: `arm${side}p${i}`, centre: [xm, 0, 26], probe: [[x0, 0, 26], [x1, 0, 26]], parts };
      items.push(side ? turnItem(item, q) : item);
    }
    // tie rod from the cage head to the top chord at the third panel point
    const tx = D.armFrom + 3 * step;
    const rod = { id: `tie${side}`, centre: [(D.headHalf + tx) / 2, 0, 26], probe: [[D.headHalf + 2, 0, 66], [tx, 0, 42]], parts: [
      { t: "lines", segs: [[[D.headHalf, 0, D.cageTop + 1.5], [tx, 0, D.chordHi[1]]]], tone: "mid", ends: true },
    ] };
    items.push(side ? turnItem(rod, q) : rod);
  }
  return items;
}

function turnItem(item, q) {
  const t3 = ([x, y, z]) => [...turn([x, y], q), z];
  return {
    ...item,
    centre: t3(item.centre),
    probe: item.probe.map(t3),
    parts: item.parts.map((part) => ({
      ...part,
      ring: part.ring?.map((point) => turn(point, q)),
      c: part.c && turn(part.c, q),
      segs: part.segs?.map((seg) => seg.map(t3)),
      dots: part.dots?.map(t3),
    })),
  };
}


const turnedCamera = (P, theta) => ({ ...P, azimuth: P.azimuth - theta });

const inWedge = (deg, wedge) => {
  const d = (((deg - wedge[0]) % 360) + 360) % 360;
  return d <= wedge[1] - wedge[0];
};


function slotOf(item, theta, wedge) {
  if (item.always) return item.always;
  return item.probe.some(([x, y]) => Math.hypot(x, y) > 3 && inWedge((Math.atan2(y, x) * 180) / Math.PI + theta, wedge)) ? "B" : "A";
}

function partSvg(part, Q, kit) {
  if (part.t === "lines") {
    const d = part.segs.map(([a, b]) => kit.segment(a, b, Q)).join("");
    const ends = part.ends ? kit.dotsSvg(part.segs.flat().map((point) => kit.iso(point, Q)), { size: 0.6, tone: "mid" }) : "";
    return kit.lineSvg(d, { tone: part.tone }) + ends + (part.ends ? `<path class="cl-hit" d="${d}"/>` : ""); // a hairline is too thin for a mouse: an unpainted wider hit area
  }
  let inner = "";
  if (part.t === "cyl") {
    if (part.ringOnly) return kit.lineSvg(kit.ring(part.c[0], part.c[1], part.r, part.z, Q, 32), { tone: "faint" });
    const paths = kit.cylinder(part.c[0], part.c[1], part.r, part.z, part.h, Q, part.steps || 28);
    if (part.seams) inner = kit.lineSvg(part.seams.map((z) => kit.sideArc(part.c[0], part.c[1], part.r, z, Q, 20)).join(""), { tone: "faint" });
    return kit.solidSvg(paths, { tone: part.tone, inner });
  }
  const paths = kit.extrude(part.ring, part.z, part.h, Q, { bevel: part.bevel || 0 });
  if (part.seam) inner = kit.lineSvg(kit.ringSeam(part.ring, part.z + part.h / 2, Q), { tone: "faint" });
  const dots = part.dots ? kit.dotsSvg(part.dots.map((point) => kit.iso(point, Q)), { size: 0.45 }) : "";
  return kit.solidSvg(paths, { tone: part.tone, inner }) + dots;
}


const pickOf = (id, part) => (id === "head" || /^(post|face)/.test(id) ? "cage" : id.startsWith("tie") ? `tie${id[3]}` : `${part.blade ? "blades" : "arm"}${id[3]}`);


function rotorFrame(items, theta, P, kit, wedge) {
  const Q = turnedCamera(P, theta);
  const slots = { A: [], B: [] };
  for (const item of items) slots[slotOf(item, theta, wedge)].push({ item, depth: kit.depthOf(item.centre, Q) });
  const out = {};
  const svgOf = (item) => {
    let html = "", open = null;
    for (const part of item.parts) {
      const key = pickOf(item.id, part);
      if (key !== open) html += `${open ? "</g>" : ""}<g data-part="${key}">`, (open = key);
      html += partSvg(part, Q, kit);
    }
    return html + "</g>";
  };
  for (const name of ["A", "B"]) {
    slots[name].sort((a, b) => a.depth - b.depth);
    out[name] = slots[name].map(({ item }) => `<g data-r="${item.id}">${svgOf(item)}</g>`).join("");
  }
  return out;
}


function gearMarks(cx, cy, r, z0, z1, count, phase, P, kit, { bolts = 0, boltR = 0, boltZ = 0, tone = "lo" } = {}) {
  const [vx, vy] = kit.towardViewer(P);
  const lines = [];
  for (let i = 0; i < count; i++) {
    const a = ((i / count) * 360 + phase) * (Math.PI / 180);
    const nx = Math.cos(a), ny = Math.sin(a);
    if (nx * vx + ny * vy < 0.12) continue;
    lines.push(kit.segment([cx + r * nx, cy + r * ny, z0], [cx + r * nx, cy + r * ny, z1], P));
  }
  let dots = "";
  if (bolts) {
    const points = [];
    for (let i = 0; i < bolts; i++) {
      const a = ((i / bolts) * 360 + phase) * (Math.PI / 180);
      points.push(kit.iso([cx + boltR * Math.cos(a), cy + boltR * Math.sin(a), boltZ], P));
    }
    dots = kit.dotsSvg(points, { size: 0.5, tone: "mid" });
  }
  return kit.lineSvg(lines.join(""), { tone }) + dots;
}





const TURN_MINUTES = 40; // one turn of the arms, real time (assumed class value)
const SPEEDUP = 120; // the figure plays 120x faster
const SECONDS_PER_TURN = (TURN_MINUTES * 60) / SPEEDUP; // 20 s on screen


const RING_TEETH = 72;
const PINION_TEETH = 15;


const BEDS = [0.5, 1, 1.6, 2.25];
const BED_NAMES = ["thin bed", "bed as on 14 Oct", "heavy bed", "very heavy bed"];


const MOUND = { at: 228, width: 30, gain: 0.6 }; // centre angle (deg, world), Gaussian width (deg), extra load at its crest

const wrap = (deg) => ((((deg + 180) % 360) + 360) % 360) - 180;
const moundAt = (deg) => Math.exp(-((wrap(deg - MOUND.at) / MOUND.width) ** 2));

const armLoad = (deg) => 1 + MOUND.gain * moundAt(deg);

const MEAN_LOAD = 2 + 2 * MOUND.gain * ((MOUND.width * Math.sqrt(Math.PI)) / 360);
const loadAt = (deg) => armLoad(deg) + armLoad(deg + 180);


function torqueAt(deg, bed, lastTorque) {
  return (lastTorque * bed * loadAt(deg)) / MEAN_LOAD;
}

const armAngle = (seconds) => ((seconds / SECONDS_PER_TURN) * 360) % 360;


if (typeof process !== "undefined" && process.argv?.includes("--check")) {
  let sum = 0;
  for (let d = 0; d < 360; d += 0.5) sum += torqueAt(d, 1, 36.378);
  const mean = sum / 720;
  console.assert(Math.abs(mean - 36.378) < 0.05, "mean torque at the recorded bed equals the last reading", mean);
  console.assert(SECONDS_PER_TURN === 20, "20 s per turn on screen");
