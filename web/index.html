<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Water Works OS</title>
  
  
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/leaflet@1.9.4/leaflet.css">
  <script type="importmap">
    { "imports": {
        "three": "/vendor/three@0.160.0/three.module.js",
        "three/addons/": "/vendor/three@0.160.0/addons/",
        "leaflet": "/vendor/leaflet@1.9.4/leaflet-src.esm.js"
    } }
  </script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="#/console">NOVA<span class="mark">TEK</span> Water Works OS <small>Riverbend WTW · synthetic</small></a>
      <form class="cmd" id="cmd" role="search">
        <label for="cmd-input" class="sr">Search or ask</label>
        <input id="cmd-input" placeholder="Search a tag, ask a question, or run an agent  (Ctrl+K)" autocomplete="off">
      </form>
      <div class="status">
        <span class="clock" id="clock" title="Plant clock">—</span>
        <span class="chip" id="llm-chip">—</span>
        <label for="role" class="sr">Acting as</label>
        <select id="role" aria-label="Acting as"></select>
      </div>
    </header>
    <nav class="rail" aria-label="Main">
      <a href="#/console" data-nav="console">Console</a>
      <a href="#/map" data-nav="map">Site map</a>
      <a href="#/region" data-nav="region">Region</a>
      <a href="#/plant" data-nav="plant">Plant</a>
      <a href="#/assets" data-nav="assets">Assets & twin</a>
      <a href="#/work" data-nav="work">Work</a>
      <a href="#/chat" data-nav="chat">Chat</a>
      <a href="#/issues" data-nav="issues">Issues</a>
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/procedures" data-nav="procedures">Procedures</a>
      <a href="#/mywork" data-nav="mywork">My work</a>
      <a href="#/agents" data-nav="agents">Agents</a>
      <a href="#/proposals" data-nav="proposals">Proposals <b id="prop-count"></b></a>
      <a href="#/knowledge" data-nav="knowledge">Knowledge</a>
      <a href="#/compliance" data-nav="compliance">Compliance</a>
      <a href="#/ontology" data-nav="ontology">Ontology</a>
      <a href="#/audit" data-nav="audit">Audit</a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
